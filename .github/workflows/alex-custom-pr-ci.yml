name: Alex Custom PR CI

on:
  pull_request:
    branches:
      - alex-custom
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alex-custom-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Printer page regression tests
        working-directory: frontend
        run: npm run test:run -- src/__tests__/pages/PrintersPage*.test.ts*
      - name: Production frontend build
        working-directory: frontend
        run: npm run build
